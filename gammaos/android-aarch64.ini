[binaries]
ar = '@NDK@/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
c = ['ccache', '@NDK@/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang', '-Wno-c++11-narrowing']
cpp = ['ccache', '@NDK@/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++', '-Wno-c++11-narrowing']
c_ld = 'lld'
cpp_ld = 'lld'
strip = '@NDK@/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkg-config = ['/bin/false']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
